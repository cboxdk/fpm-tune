name: Release

# On a version tag: build the static archives, sign their checksums, and publish a
# GitHub release. The Homebrew formula is published separately by formula.yml, which
# runs after this one — it reads the digests from the release this creates, so it
# cannot run until the release exists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # cosign keyless signing (OIDC)

jobs:
  release:
    name: build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # One script, shared with `make dist`, so a local build and this one produce
      # byte-for-byte the same archives — the installer and the formula depend on the
      # exact names and layout it emits.
      - name: Build archives
        run: sh scripts/build-release.sh "${GITHUB_REF_NAME}"

      - uses: sigstore/cosign-installer@v3

      # Sign the checksum file, not each archive: one signature covers everything, and
      # verifying an archive is then a checksum check against a file whose authorship
      # is proven. Keyless — the signer is this workflow's OIDC identity, so there is
      # no private key to store, rotate, or leak.
      - name: Sign checksums
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a pre-release suffix (-beta.1, -rc.1) is a pre-release, so it
          # is not what `brew install` or the installer's "latest" resolves to.
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $prerelease --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.cosign.bundle
