name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # Pinned to the patch, not the minor. `1.26.x` can resolve to a toolchain
  # that still ships standard-library advisories -- go1.26.6 fixes four that
  # govulncheck reports against 1.26.5. Bump this when the scan fails on the
  # standard library: that is the gate working.
  GO_VERSION: '1.26.6'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # Diff the whole tree rather than naming go.sum: a module with no
      # dependencies yet has no go.sum, and naming a path git does not know
      # fails with exit 128 instead of reporting "tidy".
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -cover ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The unit tests stand php-fpm in with `true` and `false`, which tests the
  # decision logic and nothing about the part that can take a host down. This
  # job runs the real binary: a real master, a real `php-fpm -t`, a real
  # SIGUSR2, and a real check that the master came back. Every property it
  # Every named safety guard removed in turn, with the suite required to fail
  # each time. This is here rather than in the unit job because it is the check
  # that keeps the OTHER checks honest: a test that passes against a deleted
  # guard is testing nothing, and this repo has shipped three of those — an
  # end-to-end reload test that passed with the reload removed, a rollback test
  # that only ran the success path, and a shell scenario asserting on a
  # directory the run never touched. Coverage reports all three as covered.
  #
  # It also fails when a mutation no longer MATCHES the source, which is
  # deliberate: a guard whose mutation has drifted is a guard nobody is
  # checking any more, and the fix is to update the entry, not to skip it.
  mutations:
    name: Every safety guard, removed in turn
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Remove each guard and require a failure
        run: python3 testing/mutations.py

  # asserts has been observed failing.
  integration:
    name: End-to-end against a real PHP-FPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install PHP-FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-fpm
          sudo systemctl stop php*-fpm || true
          php-fpm8.3 -v || php-fpm -v

      # With php-fpm present, the tests that skip without it now run.
      - name: Run tests with php-fpm available
        run: go test -race ./...

      - name: Build
        run: go build -o build/fpm-tune ./cmd/fpm-tune

      # Deliberately NOT under sudo. Nothing here needs root — the pools, the
      # state and the backups all live in a temp directory — and running as an
      # ordinary user is the stronger test: discovery, validation and the reload
      # all have to work without privileges they should not be assuming.
      - name: End-to-end
        run: testing/e2e.sh "$PWD/build/fpm-tune"

      # The perturbations a real host experiences. This exists because a soak on
      # a VM found a P0 that every static review, every unit test and every
      # container test had missed: a site was removed, php-fpm was reloaded, and
      # this tool's file still declared that pool — so the master would not start
      # and stayed down.
      - name: Chaos
        run: testing/chaos.sh "$PWD/build/fpm-tune"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Cross-compiled on every push: budget detection reads cgroups and
      # /proc/meminfo on Linux and sysctl on darwin, so a platform-specific path
      # is easy to break from the other platform. Switches to building the
      # binary once cmd/fpm-tune exists.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...
