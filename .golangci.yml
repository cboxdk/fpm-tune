version: "2"

linters:
  default: standard
  # errcheck, govet, ineffassign, staticcheck and unused are the default set and
  # are all clean; the rest are added deliberately.
  enable:
    - bodyclose
    - errorlint
    - misspell

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
